apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: event-booking
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres:5432/notification_db
            - name: NATS_URL
              value: nats://nats:4222
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: event-booking
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
      nodePort: 30004
