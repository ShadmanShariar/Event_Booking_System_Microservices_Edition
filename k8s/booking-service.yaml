apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: event-booking
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: booking-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres:5432/booking_db
            - name: REDIS_URL
              value: redis://redis:6379
            - name: NATS_URL
              value: nats://nats:4222
            - name: USER_SERVICE_URL
              value: http://user-service:3001
            - name: EVENT_SERVICE_URL
              value: http://event-service:3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: event-booking
spec:
  type: NodePort
  selector:
    app: booking-service
  ports:
    - port: 3003
      targetPort: 3003
      nodePort: 30003
